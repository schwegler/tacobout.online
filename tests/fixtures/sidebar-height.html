<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidebar height regression</title><link rel="stylesheet" href="../../editorial.css"><style>
body{margin:0;font:18px/1.5 system-ui;background:#f7f6fa;color:#201d2b}.tacobout-header{position:sticky;top:0;height:90px;background:#f7f6fa;border-bottom:1px solid #d5cedf;z-index:2;display:flex;align-items:center;padding:0 24px;box-sizing:border-box}button,a{min-height:44px;display:inline-flex;align-items:center;margin-right:12px}main{padding:30px;max-width:1200px;margin:auto}.wp-block-columns{display:flex;gap:65px;align-items:flex-start}.article{flex:2;min-width:0;min-height:2200px}.tacobout-sidebar-sticky{flex:1;min-width:0;background:#e9e2f3;padding:18px;box-sizing:border-box}.review{padding:20px 0;border-bottom:1px solid #cfc5df}a:focus-visible,button:focus-visible{outline:3px solid #6240a3;outline-offset:3px}@media(max-width:781px){.wp-block-columns{display:block}.article{min-height:600px}}
</style><body class="single"><header class="tacobout-header">Synthetic header · actual sidebar controller</header><main><h1>Height-aware discovery</h1><button id="grow">Load more reviews</button><button id="shrink">Remove extra reviews</button><button id="header">Enlarge header</button><div class="wp-block-columns"><article class="article"><p>The article stays in normal document flow. Resize the window or load more review content.</p><a href="#article-end">Article link</a><p id="article-end" style="margin-top:1300px">Article end marker</p></article><aside class="tacobout-sidebar-sticky"><h2>Trove reviews</h2><p class="review">A compact review with its source preserved.</p><div id="extra"></div><h2>Hot on the Wire</h2><a href="#last" id="last">Last sidebar link</a></aside></div></main><script src="../../tacobout-sidebar.js"></script><script>
document.getElementById('grow').onclick=()=>{document.getElementById('extra').innerHTML=Array.from({length:8},(_,i)=>'<p class="review">Additional synthetic review '+(i+1)+'. More content must remain reachable by ordinary page scrolling.</p>').join('');};
document.getElementById('shrink').onclick=()=>{document.getElementById('extra').replaceChildren();};
document.getElementById('header').onclick=()=>{document.querySelector('header').style.height='180px';};
</script></body></html>
