name: Publish theme release assets
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: verify
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify the tagged runtime package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python deployment/theme_release.py . "$RUNNER_TEMP/theme-release"
          python deployment/update_metadata.py "$RUNNER_TEMP/theme-release" "$RELEASE_TAG"
      - name: Attach durable public assets (never connect to hosting)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/theme-release/theme.zip" "$RUNNER_TEMP/theme-release/release.json" "$RUNNER_TEMP/theme-release/tacobout-update.json"
