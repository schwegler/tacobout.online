name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Tests
        run: ./vendor/bin/phpunit

      - name: Check masonry JavaScript and packing regressions
        run: |
          node scripts/build-assets.cjs --check
          node --check tacobout-masonry.js
          node --check tacobout-infinite-scroll.js
          node --check tacobout-sidebar.js
          node --test tests/*.test.cjs
