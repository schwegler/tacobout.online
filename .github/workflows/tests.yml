name: Tests

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Tests
        run: ./vendor/bin/phpunit

      - name: Verify native dotted-slug update routes against pinned WordPress core
        run: |
          core="$RUNNER_TEMP/wordpress-contract"
          mkdir -p "$core/wp-admin/includes"
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.3/wp-admin/includes/ajax-actions.php -o "$core/wp-admin/includes/ajax-actions.php"
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.3/wp-admin/includes/class-theme-upgrader.php -o "$core/wp-admin/includes/class-theme-upgrader.php"
          echo "a43aa39a9e1ce89d6e47fc50e1b61f428d017a7ed28b1f94a845487bc16a3757  $core/wp-admin/includes/ajax-actions.php" | sha256sum -c -
          echo "7ac1f9f8fc5389b61b8db6506d4cd431101d2ff22343ac514fe72915c7fc6956  $core/wp-admin/includes/class-theme-upgrader.php" | sha256sum -c -
          php tests/native-theme-update-route.php "$core"

      - name: Check masonry JavaScript and packing regressions
        run: |
          node scripts/build-assets.cjs --check
          node --check tacobout-masonry.js
          node --check tacobout-infinite-scroll.js
          node --check tacobout-sidebar.js
          node --test tests/*.test.cjs

  seasonal-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Check mixed feed formats and inline playback
        run: python tests/feed-formats-browser.py
      - name: Check archive portrait video sizing
        run: python tests/video-sizing-browser.py
      - name: Check responsive author profile against native markup
        run: python tests/author-profile-browser.py
      - name: Check configured author banner proportions
        run: python tests/author-banner-browser.py
      - name: Check post metadata avatars and REST-loaded cards
        run: python tests/post-avatars-browser.py
      - name: Check floating seasonal visibility and controls
        run: python tests/seasonal-placement-browser.py

  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate workflow syntax with checksum-pinned actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/tests.yml .github/workflows/releases.yml
      - name: Test release archive policy
        run: python -m unittest discover -s deployment/tests -v

  theme-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, seasonal-placement, release-tooling]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the exact tested commit without rebuilding during deployment
        run: |
          python deployment/theme_release.py . "$RUNNER_TEMP/theme-release"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'theme-release/release.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Tested commit: `' + r['source_commit'] + '`\n\nTheme ZIP SHA-256: `' + r['zip_sha256'] + '`\n')
          PYTHON
      - name: Store immutable tested theme artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-theme-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/theme-release/
          if-no-files-found: error
          retention-days: 30
