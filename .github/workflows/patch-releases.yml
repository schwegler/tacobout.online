name: Automatic patch releases

on:
  workflow_run:
    workflows: [Tests, Responsive Trove cards, Public email source guard]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; do not create commits, tags or releases
        type: boolean
        default: true

# Pending events can be coalesced by GitHub. The coordinator scans the entire
# unreleased first-parent backlog, so a replaced pending event loses no green merge.
concurrency:
  group: tacobout-patch-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'schwegler/tacobout.online' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Use the existing repository token for immutable tag pushes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Gate every exact merge SHA and publish verified patches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python deployment/patch_release.py --repo "$GH_REPO"
          else
            python deployment/patch_release.py --repo "$GH_REPO" --execute
          fi
